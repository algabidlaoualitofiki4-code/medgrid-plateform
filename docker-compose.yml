services:
  postgres:
    image: postgres:16-alpine
    container_name: medgrid-postgres
    profiles: ["core"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:7
    container_name: medgrid-mongodb
    profiles: ["core"]
    volumes:
      - mongo_data:/data/db
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: medgrid-redis
    profiles: ["core"]
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: medgrid-rabbitmq
    profiles: ["core"]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - backend
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  auth-service:
    build:
      context: .
      dockerfile: infra/Dockerfile.service
      args:
        SERVICE_NAME: auth-service
    container_name: medgrid-auth
    profiles: ["core"]
    environment:
      SERVER_PORT: 8081
      DB_URL: jdbc:postgresql://postgres:5432/auth_db
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  admission-service:
    build:
      context: .
      dockerfile: infra/Dockerfile.service
      args:
        SERVICE_NAME: admission-service
    container_name: medgrid-admission
    profiles: ["core"]
    environment:
      SERVER_PORT: 8082
      DB_URL: jdbc:postgresql://postgres:5432/admission_db
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health | grep UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  planning-service:
    build:
      context: .
      dockerfile: infra/Dockerfile.service
      args:
        SERVICE_NAME: planning-service
    container_name: medgrid-planning
    profiles: ["core"]
    environment:
      SERVER_PORT: 8083
      DB_URL: jdbc:postgresql://postgres:5432/planning_db
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health | grep UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  telemetry-service:
    build:
      context: .
      dockerfile: infra/Dockerfile.service
      args:
        SERVICE_NAME: telemetry-service
    container_name: medgrid-telemetry
    profiles: ["core"]
    environment:
      SERVER_PORT: 8084
      GRPC_SERVER_PORT: 9090
      MONGO_URI: mongodb://mongodb:27017/telemetry_db
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health | grep UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  alert-service:
    build:
      context: .
      dockerfile: infra/Dockerfile.service
      args:
        SERVICE_NAME: alert-service
    container_name: medgrid-alert
    profiles: ["core"]
    environment:
      SERVER_PORT: 8085
      DB_URL: jdbc:postgresql://postgres:5432/alert_db
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health | grep UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  insurance-service:
    build:
      context: .
      dockerfile: infra/Dockerfile.service
      args:
        SERVICE_NAME: insurance-service
    container_name: medgrid-insurance
    profiles: ["core"]
    environment:
      SERVER_PORT: 8086
      DB_URL: jdbc:postgresql://postgres:5432/insurance_db
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8086/actuator/health | grep UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  billing-service:
    build:
      context: .
      dockerfile: infra/Dockerfile.service
      args:
        SERVICE_NAME: billing-service
    container_name: medgrid-billing
    profiles: ["core"]
    environment:
      SERVER_PORT: 8087
      DB_URL: jdbc:postgresql://postgres:5432/billing_db
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8087/actuator/health | grep UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  audit-service:
    build:
      context: .
      dockerfile: infra/Dockerfile.service
      args:
        SERVICE_NAME: audit-service
    container_name: medgrid-audit
    profiles: ["core"]
    environment:
      SERVER_PORT: 8088
      MONGO_URI: mongodb://mongodb:27017/audit_db
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8088/actuator/health | grep UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  device-simulator:
    build:
      context: .
      dockerfile: infra/Dockerfile.service
      args:
        SERVICE_NAME: device-simulator
    container_name: medgrid-simulator
    profiles: ["chaos"]
    environment:
      SERVER_PORT: 8089
    depends_on:
      telemetry-service:
        condition: service_healthy
    networks:
      - backend

  medgrid-gateway:
    build:
      context: .
      dockerfile: infra/Dockerfile.service
      args:
        SERVICE_NAME: medgrid-gateway
    container_name: medgrid-gateway
    profiles: ["core"]
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: medgrid-prometheus
    profiles: ["observability"]
    ports:
      - "9091:9090"
    networks:
      - backend

  grafana:
    image: grafana/grafana:11.2.2
    container_name: medgrid-grafana
    profiles: ["observability"]
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - backend

volumes:
  postgres_data:
  mongo_data:
  rabbitmq_data:

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true
